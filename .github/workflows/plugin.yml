name: Plugin

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check release tag
        run: |
          VERSION="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v${VERSION}" ]; then
            echo "Error: Release tag '$GITHUB_REF_NAME' must match project version 'v${VERSION}'." >&2
            exit 1
          fi

      - name: Lint
        run: uv run task lint

      - name: Test
        run: uv run task test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

      - name: Release plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        run: |
          uv run plugin-version release \
            --release-tag "$GITHUB_REF_NAME" \
            --github-token "$GITHUB_TOKEN" \
            --qgis-token "$QGIS_PLUGIN_TOKEN" \
            --disable-submodule-update
