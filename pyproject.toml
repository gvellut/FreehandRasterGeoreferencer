[project]
name = "freehand-raster-georeferencer"
version = "0.400.0"
description = "QGIS plugin for interactive raster georeferencing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
plugin-version = "scripts.plugin_version:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.3.0",
    "pytest>=8.4.0",
    "qgis-plugin-ci>=2.10.0",
    "ruff>=0.12.0",
    "taskipy>=1.14.0",
]

[tool.qgis-plugin-ci]
plugin_path = "src/fhrgr"
github_organization_slug = "gvellut"
project_slug = "FreehandRasterGeoreferencer"

[tool.taskipy.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
test = "pytest"
sync-version = "plugin-version sync"
package = "plugin-version package --allow-uncommitted-changes --disable-submodule-update"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".prompts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
order-by-type = true

[tool.uv]
exclude-newer = "7 days"

[tool.uv.build-backend]
module-name = "scripts"
